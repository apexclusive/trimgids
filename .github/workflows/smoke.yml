name: TrimGids smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start server
        run: node server.mjs > /tmp/trimgids-server.log 2>&1 &
      - name: Run route and API smoke test
        run: BASE_URL=http://localhost:3000 node smoke.mjs
