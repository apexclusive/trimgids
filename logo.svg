<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title>TrimGids</title>
  <defs>
    <linearGradient id="g" x1="10" y1="10" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Donkere achtergrond -->
  <rect width="200" height="200" rx="36" fill="#062719"/>
  <!-- Klaver / paw symbool -->
  <g filter="url(#shadow)" fill="url(#g)">
    <path d="M100 55 C130 55 150 75 150 100 C150 125 125 150 100 150 C75 150 55 130 55 100 C55 75 75 55 100 55 Z" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round"/>
    <path d="M70 95 C90 75 110 80 120 100 C125 115 105 130 90 120" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <path d="M130 95 C110 75 90 80 80 100 C75 115 95 130 110 120" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>
    <path d="M85 80 C100 60 115 70 130 85" fill="none" stroke="#5eead4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="100" cy="105" r="6" fill="#fff7d6"/>
  </g>
  <!-- Tekst -->
  <text x="100" y="160" text-anchor="middle" fill="#d97706" font-family="'Plus Jakarta Sans', 'Sora', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-2">trim</text>
  <text x="100" y="178" text-anchor="middle" fill="#fbbf24" font-family="'Sora', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="4">gids</text>
</svg>
