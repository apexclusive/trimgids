<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="tgLogoTitle">
  <title id="tgLogoTitle">TrimGids pootlogo</title>
  <defs>
    <linearGradient id="pawGold" x1="18" y1="12" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe9b8"/>
      <stop offset=".45" stop-color="#f2bb52"/>
      <stop offset="1" stop-color="#c08322"/>
    </linearGradient>
    <radialGradient id="pawSheen" cx="50%" cy="18%" r="70%">
      <stop stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pawSoft" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.4" flood-color="#1a1206" flood-opacity=".26"/>
    </filter>
  </defs>

  <g filter="url(#pawSoft)" fill="url(#pawGold)" aria-hidden="true">
    <!-- Vier teenkussentjes in een natuurlijke boog (buitenste lager + schuiner) -->
    <ellipse cx="20"  cy="46" rx="8"   ry="11"  transform="rotate(-38 20 46)"/>
    <ellipse cx="36"  cy="30" rx="9"   ry="12.5" transform="rotate(-15 36 30)"/>
    <ellipse cx="60"  cy="29" rx="9"   ry="12.5" transform="rotate(15 60 29)"/>
    <ellipse cx="76"  cy="45" rx="8"   ry="11"  transform="rotate(38 76 45)"/>
    <!-- Groot voetzoolkussen met drie lobben (hartvorm) -->
    <path d="M48 44c-8.6 0-15.6 4.4-18.9 11.2-2.4 4.9-6.4 8-10.6 10.2-4.2 2.2-6 7.2-3.3 10.7 2.8 3.6 8.6 4 12.6 1.9 3.4-1.8 7.5-1.9 11-.4 3 1.3 6.2 2 9.2 2s6.2-.7 9.2-2c3.5-1.5 7.6-1.4 11 .4 4 2.1 9.8 1.7 12.6-1.9 2.7-3.5.9-8.5-3.3-10.7-4.2-2.2-8.2-5.3-10.6-10.2C63.6 48.4 56.6 44 48 44Z"/>
  </g>

  <!-- Zachte glans voor diepte, zonder kader -->
  <g fill="url(#pawSheen)" aria-hidden="true">
    <ellipse cx="34" cy="27" rx="6.5" ry="8" transform="rotate(-15 34 27)"/>
    <ellipse cx="62" cy="26" rx="6.5" ry="8" transform="rotate(15 62 26)"/>
    <ellipse cx="48" cy="52" rx="16" ry="7"/>
  </g>
</svg>
